# =============================================================
# Template nginx IRMS dengan TLS — BELUM terpasang di server.
#
# Blueprint §5 mewajibkan HTTPS ("session hijacking → HTTPS wajib"). Saat ini
# nginx hanya listen 80, jadi JWT dan password login melintas sebagai teks biasa
# di jaringan kantor; siapa pun di segmen yang sama bisa memanennya.
#
# Pasang dengan (jalankan di server, butuh root):
#   1. Siapkan sertifikat (lihat pilihan di bawah).
#   2. cp irms-tls.conf /etc/nginx/sites-available/irms
#   3. nginx -t          # WAJIB: uji dulu, jangan langsung reload
#   4. systemctl reload nginx
#
# ── Pilihan sertifikat ───────────────────────────────────────
# Server ini di LAN (192.168.5.105) tanpa DNS publik, jadi Let's Encrypt
# HTTP-01 TIDAK bisa dipakai. Pilih salah satu:
#   (a) CA internal KPI — paling baik: browser yang sudah mempercayai CA itu
#       tidak menampilkan peringatan sama sekali.
#   (b) Self-signed — cepat, tapi setiap browser menampilkan peringatan:
#       openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#         -keyout /etc/ssl/private/irms.key -out /etc/ssl/certs/irms.crt \
#         -subj "/CN=irms.kpi.local" \
#         -addext "subjectAltName=DNS:irms.kpi.local,IP:192.168.5.105"
#       chmod 600 /etc/ssl/private/irms.key
#   (c) Let's Encrypt DNS-01 — hanya bila domain KPI bisa dipakai.
#
# ── JEBAKAN HSTS: baca sebelum memasang sertifikat self-signed ──
# Backend mengirim header Strict-Transport-Security. Bila dipadukan dengan sertifikat
# self-signed pada sebuah NAMA HOST, Chrome mengubah peringatan sertifikat menjadi
# blokir yang TIDAK BISA dilewati ("Proceed anyway" hilang) selama masa max-age — dan
# efeknya menempel di browser tiap pengguna, tidak bisa dibatalkan dari sisi server.
#
# Header itu kini bisa diatur tanpa mengubah kode (lihat HstsProperties):
#   HSTS_ENABLED=false     → matikan sementara selama sertifikat belum tepercaya
#   HSTS_MAX_AGE=300       → uji coba dengan masa berlaku pendek dulu
# Set di /etc/backend.env, lalu restart service backend.
#
# Urutan aman:
#   1. Pasang TLS dengan HSTS_ENABLED=false.
#   2. Pastikan sertifikat sudah tepercaya di browser pengguna (opsi a atau c).
#   3. Baru nyalakan HSTS — mulai dari HSTS_MAX_AGE kecil, naikkan setelah yakin.
# Alternatif tanpa risiko: pakai opsi (b) tapi HANYA lewat alamat IP, karena browser
# mengabaikan HSTS untuk alamat IP.
# =============================================================

# Semua HTTP dialihkan ke HTTPS. Tidak ada satu pun rute aplikasi yang
# dilayani di port 80 — kalau tidak, pengalihan jadi opsional dan JWT tetap
# bisa terkirim polos oleh klien yang memakai http:// secara eksplisit.
server {
  listen 80;
  server_name irms.kpi.local 192.168.5.105;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name irms.kpi.local 192.168.5.105;

  ssl_certificate     /etc/ssl/certs/irms.crt;
  ssl_certificate_key /etc/ssl/private/irms.key;

  # TLS 1.2 ke atas saja. TLS 1.0/1.1 sudah ditarik dan hanya menambah
  # permukaan serangan tanpa klien yang benar-benar membutuhkannya di sini.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Header HSTS TIDAK dipasang di sini: backend sudah mengirimnya sendiri, dan
  # dua sumber akan menghasilkan header ganda. Lihat jebakan HSTS di atas.

  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $proxy_add_x_forwarded_for MENAMBAHKAN klaim X-Forwarded-For milik klien,
    # jadi entri pertama header ini tidak bisa dipercaya. LoginThrottleService
    # menghitung dari kanan justru karena itu — jangan ganti ke $remote_addr saja
    # tanpa menyesuaikan app.security.login-throttle.trusted-hop-count.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # $scheme kini https, sehingga backend tahu koneksi aslinya sudah terenkripsi.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }

  # WebSocket (opsional)
  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8080;
  }
}
