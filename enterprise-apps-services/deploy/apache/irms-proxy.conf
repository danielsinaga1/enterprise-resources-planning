# cPanel/WHM Apache include snippet for reverse proxying to Spring Boot
# Place this file in both paths (adjust USERNAME and DOMAIN):
#  - /etc/apache2/conf.d/userdata/std/2_4/USERNAME/DOMAIN/irms-proxy.conf
#  - /etc/apache2/conf.d/userdata/ssl/2_4/USERNAME/DOMAIN/irms-proxy.conf
# Then rebuild and reload Apache.

<IfModule proxy_module>
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https" expr=%{HTTPS} == 'on'

  # Main reverse proxy to Spring Boot (listening on 127.0.0.1:8080)
  ProxyPass        /  http://127.0.0.1:8080/
  ProxyPassReverse /  http://127.0.0.1:8080/

  # Optional: WebSocket endpoint example
  <IfModule proxy_wstunnel_module>
    ProxyPass        /ws  ws://127.0.0.1:8080/ws
    ProxyPassReverse /ws  ws://127.0.0.1:8080/ws
  </IfModule>
</IfModule>
