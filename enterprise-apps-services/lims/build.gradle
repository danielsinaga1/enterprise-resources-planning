// ─────────────────────────────────────────────────────────────────────
// :lims — Laboratory Information Management System module.
//
// Already package-isolated (id.enterpriseapps.lims.*) with its own
// database (db_lims). Depends only on :shared. This is the cleanest
// strangler-fig extraction target: when LIMS later becomes its own
// microservice, this module already has a sharp boundary.
// ─────────────────────────────────────────────────────────────────────
plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'id'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.4"
    }
}

dependencies {
    // Shared kernel (Response, UserEntity, UserRepository, ...).
    api(project(':shared'))

    // Spring stack used by LIMS controllers/services/entities.
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.boot:spring-boot-starter-aop")

    // Kafka consumer — keeps the local lims_users snapshot in sync with
    // auth.user.events published by the auth/core module.
    implementation("org.springframework.kafka:spring-kafka")

    // HTTP + JSON for external clients (PubChem).
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.google.code.gson:gson:2.11.0")

    // OpenAPI / Swagger annotations on LIMS controllers.
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.11")

    compileOnly("org.projectlombok:lombok:1.18.34")
    annotationProcessor("org.projectlombok:lombok:1.18.34")
    annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")
}
