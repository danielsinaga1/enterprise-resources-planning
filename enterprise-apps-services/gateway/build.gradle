plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'id.enterpriseapps'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Spring Cloud version aligned with Spring Boot 3.5.x
ext {
    springCloudVersion = '2025.0.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring Cloud Gateway (reactive — WebFlux, NOT spring-cloud-starter-gateway-mvc)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    // Rate limiting via Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // Actuator for health/info endpoints
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Exposes /actuator/prometheus for Prometheus scraping
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // JWT validation (same version as backend)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Lombok
    compileOnly    'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

// The gateway is a standalone bootable JAR — do NOT package shared/erp as deps
bootJar {
    archiveFileName = 'enterprise-apps-gateway.jar'
}
