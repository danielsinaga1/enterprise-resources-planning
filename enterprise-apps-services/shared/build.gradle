// ─────────────────────────────────────────────────────────────────────
// :shared — the shared kernel.
//
// Holds cross-cutting types every domain module needs. It depends on NO
// other internal module (it is the root of the dependency graph), so it
// must never import id.enterpriseapps.irms / .lims code.
//
// First slice contents (the minimum :lims requires):
//   response.Response, constant.StatusConstant, exception.CustomException,
//   entity.UserEntity, repository.UserRepository
//
// Later slices will migrate the rest of the platform kernel here
// (auth, RBAC, notification, config, utils, observability, integration).
// ─────────────────────────────────────────────────────────────────────
plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'id'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

dependencyManagement {
    imports {
        // Manage versions with the same Spring Boot BOM the app uses, so
        // library modules and the app stay perfectly version-aligned.
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.4"
    }
}

dependencies {
    // UserEntity (jakarta.persistence) + UserRepository (Spring Data JPA).
    api("org.springframework.boot:spring-boot-starter-data-jpa")
    // Response uses org.springframework.http.HttpStatus.
    api("org.springframework.boot:spring-boot-starter-web")
    // DomainEventPublisher — the best-effort Kafka producer shared by every
    // module. Exposed as `api` so feature modules inherit KafkaTemplate too.
    api("org.springframework.kafka:spring-kafka")

    compileOnly("org.projectlombok:lombok:1.18.34")
    annotationProcessor("org.projectlombok:lombok:1.18.34")
}
