# Verify + deploy backend & gateway ke server dev KPI (192.168.5.105) lewat baik-deploy.
#
# Runner: self-hosted, terpasang LANGSUNG di server 192.168.5.105 (bukan mesin
# LAN terpisah). Build, health check, dan rollback saat deploy sepenuhnya
# didelegasikan ke skrip `baik-deploy` yang sudah teruji.
#
# Kenapa ada job `verify` di depan: `baik-deploy` membangun JAR dengan
# `./gradlew bootJar -x test`, jadi tanpa gate ini tidak ada satu pun test yang
# pernah jalan sebelum kode tayang — push ke main langsung men-deploy apa saja.
# `deploy` menunggu `verify` lewat `needs:`, sehingga suite yang merah
# menghentikan rilis alih-alih menjadi insiden produksi.
#
# Prasyarat di server (belum otomatis, setup manual sekali):
#   - Self-hosted runner terdaftar (repo Settings → Actions → Runners → New
#     self-hosted runner) dan jalan sebagai service.
#   - User yang menjalankan runner punya izin sudo TANPA PASSWORD khusus untuk
#     baik-deploy, mis. /etc/sudoers.d/baik-deploy:
#       <runner-user> ALL=(root) NOPASSWD: /usr/local/bin/baik-deploy
#   - User runner tergabung di grup `docker` (`sudo usermod -aG docker <runner-user>`,
#     lalu restart service runner). Empat kelas test @SpringBootTest memakai
#     Testcontainers dan butuh akses daemon Docker; langkah "Preflight" di bawah
#     memeriksanya lebih dulu supaya kegagalannya jelas, bukan berupa
#     ExceptionInInitializerError yang menyesatkan.
name: Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  verify:
    name: Compile & test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Testcontainers memerlukan daemon Docker. Dicek eksplisit supaya penyebab
      # kegagalan terbaca di sini, bukan tersembunyi di stack trace test.
      - name: Preflight — akses daemon Docker
        run: |
          docker info >/dev/null 2>&1 || {
            echo "::error::Runner tidak bisa menghubungi daemon Docker. Test Testcontainers (@SpringBootTest) akan gagal. Perbaiki: sudo usermod -aG docker \$USER && sudo systemctl restart actions.runner.*"
            exit 1
          }

      # `sh ./gradlew`, bukan `./gradlew`: checkout dari Windows kadang kehilangan exec bit.
      - name: Compile (main + test)
        run: sh ./gradlew compileJava compileTestJava --no-daemon

      - name: Test
        run: sh ./gradlew test --no-daemon

      - name: Unggah laporan test bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-test-backend
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy via baik-deploy
    runs-on: self-hosted
    needs: verify
    # Pull request hanya diverifikasi, tidak ikut men-deploy.
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy via baik-deploy
        run: sudo baik-deploy backend
