// ─────────────────────────────────────────────────────────────────────
// :smartdocs — SmartDocs, pengelolaan dokumen hasil OCR.
//
// Package-isolated (id.enterpriseapps.smartdocs.*) dengan database
// sendiri (db_smartdocs), mengikuti pola :lims. Tidak ada foreign key
// lintas database: identitas pengguna hanya dicatat sebagai username +
// id pada activity_logs, bukan relasi ke tabel auth.
//
// Mesin OCR-nya berada di luar modul ini (service Python terpisah yang
// menulis ke database yang sama), jadi modul ini murni baca/tulis data
// dokumen dan agregat laporannya.
// ─────────────────────────────────────────────────────────────────────
plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'id'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.4"
    }
}

dependencies {
    // Shared kernel (Response, dll).
    api(project(':shared'))

    implementation("org.springframework.boot:spring-boot-starter-data-jpa")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation("org.springframework.boot:spring-boot-starter-security")

    // Anotasi OpenAPI pada controller.
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.11")

    compileOnly("org.projectlombok:lombok:1.18.34")
    annotationProcessor("org.projectlombok:lombok:1.18.34")
}
