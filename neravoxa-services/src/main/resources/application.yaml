spring:
  application:
    name: neravoxa
  profiles:
    active: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: false

# =============================================================
# OBSERVABILITY — Actuator + Micrometer Metrics + OTel Tracing
# Profile-specific overrides (sampling probability, endpoints)
# live in application-dev.yaml / application-prod.yaml.
# Everything is overridable via environment variables so no
# secret or endpoint is hard-coded for Docker/k8s deployments.
# =============================================================
management:
  endpoints:
    web:
      exposure:
        # Only expose what the observability stack needs.
        include: health,info,prometheus,metrics
      base-path: /actuator
  health:
    # Cek koneksi AD hanya bila login LDAP aktif; saat app.ldap.enabled=false (dev) server AD
    # memang tidak dipakai, dan indikator ini membuat /actuator/health selalu DOWN.
    ldap:
      enabled: ${app.ldap.enabled:true}
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true            # /actuator/health/liveness & /readiness
  info:
    env:
      enabled: true
    git:
      mode: full
  # --- Metrics (Micrometer -> Prometheus) ---
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # Common tags attached to every meter — lets Grafana split by app/instance.
      application: ${spring.application.name}
    distribution:
      # Publish histogram buckets so Grafana can compute true latency percentiles.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s
  # --- Tracing (Micrometer Tracing -> OpenTelemetry -> OTLP) ---
  tracing:
    enabled: true
    sampling:
      # Head-based sampling. 100% in dev, 10% in prod (see profile files).
      probability: ${OTEL_TRACES_SAMPLER_PROB:1.0}
    propagation:
      type: w3c                  # W3C tracecontext (traceparent header)
  otlp:
    tracing:
      # OTLP/HTTP endpoint of the OpenTelemetry Collector. In Docker this is
      # overridden to http://otel-collector:4318/v1/traces.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  # --- Enable @Observed annotation support (ObservedAspect) ---
  observations:
    annotations:
      enabled: true

springdoc:
  api-docs:
    path: /api/docs
    groups:
      enabled: true
  swagger-ui:
    path: /api/docs/index.html

app:
  # ERP (port fitur ENTARIS) — modul :erp, database db_erp.
  erp:
    # Pasang sql/erp_service/01_schema.sql + 02_seed.sql bila db_erp masih kosong saat boot.
    auto-init: ${ERP_AUTO_INIT:true}
    # Lampiran dokumen keuangan ERP (privat; JANGAN di dalam folder uploads/ yang publik).
    storage-dir: ${ERP_STORAGE_DIR:}
  # Asisten AI ERP (RAG). Embedding & jawaban dihitung model Hugging Face lewat Inference
  # Providers; vektor disimpan di db_erp. Tanpa HF_TOKEN asisten nonaktif, tetapi saran
  # "langkah berikutnya" (berbasis aturan) tetap jalan. Data percakapan, potongan dokumen,
  # dan hasil tool dikirim ke penyedia model Hugging Face saat asisten dipakai.
  assistant:
    hf-token: ${HF_TOKEN:}
    base-url: ${HF_BASE_URL:https://router.huggingface.co}
    # Model chat (OpenAI-compatible, mendukung tool calling). Akhiran ":fastest" / ":cheapest"
    # atau ":<provider>" mengatur pemilihan penyedia.
    chat-model: ${ASSISTANT_CHAT_MODEL:openai/gpt-oss-120b}
    # Model embedding multibahasa (penyedia hf-inference, pipeline feature-extraction).
    embedding-model: ${ASSISTANT_EMBEDDING_MODEL:intfloat/multilingual-e5-large}
    # Awalan khusus keluarga model E5; kosongkan untuk model lain (mis. BAAI/bge-m3).
    query-prefix: '${ASSISTANT_QUERY_PREFIX:query: }'
    passage-prefix: '${ASSISTANT_PASSAGE_PREFIX:passage: }'
    top-k: ${ASSISTANT_TOP_K:6}
    # Skor cosine minimum. Skor E5 berkisar ~0,7–0,9, jadi ambang ini sengaja rendah; potongan
    # yang jauh di bawah skor terbaik tetap dibuang (lihat KnowledgeStore.search).
    min-score: ${ASSISTANT_MIN_SCORE:0.70}
    timeout-seconds: ${ASSISTANT_TIMEOUT_SECONDS:60}
    max-upload-mb: ${ASSISTANT_MAX_UPLOAD_MB:10}
    # Batas permintaan chat per pengguna per 5 menit (mengendalikan biaya model).
    requests-per-5-min: ${ASSISTANT_RATE_LIMIT:30}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-expiration: ${JWT_EXPIRATION:86400000}        # 24 hours
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days
  config:
    allowedOrigins: ${APP_ALLOWED_ORIGINS:*}
  security:
    # Header Strict-Transport-Security. WAJIB dibaca sebelum menyalakan TLS dengan
    # sertifikat self-signed: HSTS menempel di browser tiap pengguna dan tidak bisa
    # dibatalkan dari server. Detail lengkap di HstsProperties.
    hsts:
      enabled: ${HSTS_ENABLED:true}
      max-age-seconds: ${HSTS_MAX_AGE:31536000}
      include-sub-domains: ${HSTS_INCLUDE_SUBDOMAINS:true}
      # Hanya berlaku untuk domain publik terdaftar; tak ada artinya di host internal.
      preload: ${HSTS_PRELOAD:false}
      # Mengirim HSTS lewat HTTP biasa pun diabaikan browser (RFC 6797 §7.2), jadi
      # ini tidak menambah keamanan — hanya membuat header aktif mendadak saat TLS naik.
      all-requests: ${HSTS_ALL_REQUESTS:false}
    # Proteksi brute-force pada POST /api/v1/auth/login. Penghitung utama per-NPK, bukan
    # per-IP: nginx memakai $proxy_add_x_forwarded_for sehingga entri terdepan
    # X-Forwarded-For berasal dari klien dan bisa dipalsukan.
    login-throttle:
      enabled: ${LOGIN_THROTTLE_ENABLED:true}
      max-attempts: ${LOGIN_THROTTLE_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_THROTTLE_WINDOW_SECONDS:300}
      lockout-seconds: ${LOGIN_THROTTLE_LOCKOUT_SECONDS:900}
      # Lapis per-IP mati secara default. trusted-hop-count yang salah akan membuat semua
      # permintaan tampak berasal dari satu IP (gateway) dan mengunci semua pengguna
      # sekaligus. Verifikasi dulu log DEBUG LoginThrottleService di server, baru nyalakan.
      ip-enabled: ${LOGIN_THROTTLE_IP_ENABLED:false}
      ip-max-attempts: ${LOGIN_THROTTLE_IP_MAX_ATTEMPTS:30}
      # nginx -> gateway -> backend: gateway menambahkan IP nginx, jadi 1 hop tepercaya.
      trusted-hop-count: ${LOGIN_THROTTLE_TRUSTED_HOPS:1}
  ldap:
    # When false, login falls back to the local bcrypt password flow (default for dev).
    # Set to true in environments that have an Active Directory reachable.
    enabled: ${LDAP_ENABLED:true}
    # AD DNS domain, used to derive the base DN when root-dn is blank.
    domain: ${LDAP_DOMAIN:kpi.co.id}
    # AD LDAP URL (use ldaps://...:636 for TLS)
    url: ${LDAP_URL:ldap://dcbtg3.kpi.co.id:389}
    # Optional root/base DN. Blank = derive from domain (DC=kpi,DC=co,DC=id) and search the whole tree.
    # NOTE: KPI users live under OU=... not cn=users, so leave this blank.
    root-dn: ${LDAP_ROOT_DN:}
    # --- search-then-bind: users log in with their employeeID (NPK), not their AD username ---
    # Service account that performs the initial lookup (UPN or DN). REQUIRED when enabled=true.
    # No defaults on purpose — real AD credentials must NEVER be committed to this file.
    # Set LDAP_MANAGER_DN / LDAP_MANAGER_PASSWORD via environment (see .env.example).
    manager-dn: ${LDAP_MANAGER_DN:}
    manager-password: ${LDAP_MANAGER_PASSWORD:}
    # Base for the user search, relative to root-dn. Blank = whole tree.
    user-search-base: ${LDAP_USER_SEARCH_BASE:}
    # Filter to locate the account by what the user typed; {0} = the login input.
    # Default menerima NPK (employeeID) ATAU username AD (sAMAccountName), jadi pengguna
    # bisa masuk dengan salah satunya. Pencocokan ke tabel lokal tetap lewat employeeID
    # (lihat user-match), sehingga login via username tetap tersambung ke record yang benar.
    user-search-filter: ${LDAP_USER_SEARCH_FILTER:(|(employeeID={0})(sAMAccountName={0}))}
    # How the authenticated AD account maps to the local users table: "npk", "email", or "employeeID"
    # (employeeID = local users.npk equals AD employeeID attribute -- KPI default)
    user-match: ${LDAP_USER_MATCH:employeeID}
    # Also include roles assigned in the local user_role table (recommended)
    merge-db-roles: ${LDAP_MERGE_DB_ROLES:true}
    # Setiap bind AD yang berhasil ikut memperbarui hash bcrypt lokal. Wajib ON: tanpa ini hash
    # lokal membeku pada nilai saat migrasi, sehingga user yang sudah ganti password di AD
    # ditolak oleh jalur lokal (local-login-npks / saat LDAP dimatikan).
    sync-password: ${LDAP_SYNC_PASSWORD:true}
    # NPKs that exist in the local DB but NOT in Active Directory. These bypass the AD bind and
    # authenticate via the local bcrypt password flow even when enabled=true (comma-separated).
    local-login-npks: ${LDAP_LOCAL_LOGIN_NPKS:admin}
    # Optional AD group (CN) -> application role code mapping, e.g.
    #   LDAP_GROUP_ROLE_MAPPINGS_0=IT-Admins:ADMIN
    # group-role-mappings:
    #   IT-Admins: ADMIN
