// ─────────────────────────────────────────────────────────────────────
// :shared — the shared kernel.
//
// Holds cross-cutting types every domain module needs. It depends on NO
// other internal module (it is the root of the dependency graph).
//
// Contents: response.Response, constant.StatusConstant, exception.CustomException.
// ─────────────────────────────────────────────────────────────────────
plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'id'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

dependencyManagement {
    imports {
        // Manage versions with the same Spring Boot BOM the app uses, so
        // library modules and the app stay perfectly version-aligned.
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.4"
    }
}

dependencies {
    api("org.springframework.boot:spring-boot-starter-data-jpa")
    // Response uses org.springframework.http.HttpStatus.
    api("org.springframework.boot:spring-boot-starter-web")

    compileOnly("org.projectlombok:lombok:1.18.34")
    annotationProcessor("org.projectlombok:lombok:1.18.34")
}
