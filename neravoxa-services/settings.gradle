plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'neravoxa'

// ─────────────────────────────────────────────────────────────────────
// Modular monolith. The root project is the bootable Spring Boot app
// (auth, RBAC/menu, profil) and depends on these library modules:
//     :erp    -> :shared
//     (root)  -> :shared, :erp
// No module depends back on the root app. All modules keep the
// id.neravoxa.* namespace so component/entity scanning just works.
// ─────────────────────────────────────────────────────────────────────
include 'shared'
include 'erp'
include 'gateway'
